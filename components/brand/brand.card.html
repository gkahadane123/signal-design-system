<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>body{padding:16px;box-sizing:border-box}</style></head><body><div id="root"></div>
<script type="text/babel">
function dsReady(fn, tries=0){ if (window.SignalDesignSystem_167090) fn(); else if (tries<200) setTimeout(()=>dsReady(fn,tries+1),50); }
dsReady(() => {
const { Logo, LineGrid, GradientTile, Stat } = window.SignalDesignSystem_167090;
ReactDOM.createRoot(document.getElementById("root")).render(
  <div style={{display:"grid",gridTemplateColumns:"1.6fr 1fr 1fr",gap:12}}>
    <LineGrid framing style={{borderRadius:12,border:"1px solid var(--border-hairline)",height:208}} contentStyle={{display:"flex",alignItems:"center",justifyContent:"center",height:"100%"}}>
      <Logo height={34} />
    </LineGrid>
    <GradientTile theme="current" label="Signal" caption="Aqua doubles as the semantic signal" />
    <GradientTile theme="night" label="Decision">
      <div style={{alignSelf:"flex-end"}}><Stat onDark value="34" size="sm" label="markets" /></div>
    </GradientTile>
  </div>
);
});
</script></body></html>
