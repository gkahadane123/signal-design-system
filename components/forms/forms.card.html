<!-- @dsCard group="Components" viewport="700x230" name="Forms" subtitle="Button, Input, Select, Checkbox, Radio, Switch" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:16px;box-sizing:border-box}</style></head><body><div id="root"></div>
<script type="text/babel">
function dsReady(fn, tries=0){ if (window.SignalDesignSystem_167090) fn(); else if (tries<200) setTimeout(()=>dsReady(fn,tries+1),50); }
dsReady(() => {
const { Button, Input, Select, Checkbox, Radio, Switch } = window.SignalDesignSystem_167090;
function Demo(){
  const [ck,setCk]=React.useState(true); const [sw,setSw]=React.useState(true); const [r,setR]=React.useState("live");
  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
      <Button size="sm">Request a demo</Button><Button>Request a demo</Button><Button variant="ghost">Explore the platform</Button><Button disabled>Disabled</Button>
      <span style={{background:"var(--ink)",borderRadius:8,padding:6}}><Button variant="ghost" onDark size="sm">On dark</Button></span>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,alignItems:"start"}}>
      <Input label="Work email" placeholder="you@company.com" hint="We reply within one business day" />
      <Input label="Markets" defaultValue="US only" error="Enter at least one market" />
      <Select label="Market" options={["United States","United Kingdom","India"]} />
    </div>
    <div style={{display:"flex",gap:24,alignItems:"center",flexWrap:"wrap"}}>
      <Checkbox label="Track availability" checked={ck} onChange={setCk} />
      <Radio name="p" value="live" label="Live refresh" checked={r==="live"} onChange={setR} />
      <Radio name="p" value="daily" label="Daily" checked={r==="daily"} onChange={setR} />
      <Switch label="Alerts" checked={sw} onChange={setSw} />
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
});
</script></body></html>
