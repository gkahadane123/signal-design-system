<!-- @dsCard group="Structure" viewport="700x150" name="Spacing scale" subtitle="8px rhythm; 32px is the grid unit." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{color:var(--ink);display:flex;align-items:flex-end;gap:14px;padding:16px 24px 20px;box-sizing:border-box;height:150px}.s{display:flex;flex-direction:column;gap:6px;align-items:center}.b{background:var(--tint-coral-24);border:1px solid var(--coral);border-radius:3px};.t-caption{color:var(--tint-ink-64)}</style></head><body>
<div class="s"><div class="b" style="width:4px;height:4px"></div><span class="t-caption t-data">4</span></div>
<div class="s"><div class="b" style="width:8px;height:8px"></div><span class="t-caption t-data">8</span></div>
<div class="s"><div class="b" style="width:12px;height:12px"></div><span class="t-caption t-data">12</span></div>
<div class="s"><div class="b" style="width:16px;height:16px"></div><span class="t-caption t-data">16</span></div>
<div class="s"><div class="b" style="width:24px;height:24px"></div><span class="t-caption t-data">24</span></div>
<div class="s"><div class="b" style="width:32px;height:32px;background:var(--tint-aqua-32);border-color:var(--reef)"></div><span class="t-caption t-data">32 · grid</span></div>
<div class="s"><div class="b" style="width:48px;height:48px"></div><span class="t-caption t-data">48</span></div>
<div class="s"><div class="b" style="width:64px;height:64px"></div><span class="t-caption t-data">64</span></div>
<div class="s"><div class="b" style="width:96px;height:96px"></div><span class="t-caption t-data">96</span></div>
</body></html>
