<!-- @dsCard group="Gradients" viewport="700x190" name="Six coded gradients" subtitle="Ember · Depth · Current · Bloom · Glow · Night — section backgrounds via .sig-grad-<name>." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{color:var(--ink);display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:16px;box-sizing:border-box;height:190px}.g{display:flex;flex-direction:column;gap:8px}.g .sq{aspect-ratio:1;border-radius:var(--radius-card-sm)}.g .t-caption{color:var(--tint-ink-64)}</style></head><body>
<div class="g"><div class="sq sig-grad-ember"></div><span class="t-small">Ember</span><span class="t-caption" style="margin-top:-6px">pricing</span></div>
<div class="g"><div class="sq sig-grad-depth"></div><span class="t-small">Depth</span><span class="t-caption" style="margin-top:-6px">availability</span></div>
<div class="g"><div class="sq sig-grad-current"></div><span class="t-small">Current</span><span class="t-caption" style="margin-top:-6px">signal</span></div>
<div class="g"><div class="sq sig-grad-bloom"></div><span class="t-small">Bloom</span><span class="t-caption" style="margin-top:-6px">assortment</span></div>
<div class="g"><div class="sq sig-grad-glow"></div><span class="t-small">Glow</span><span class="t-caption" style="margin-top:-6px">digital shelf</span></div>
<div class="g"><div class="sq sig-grad-night"></div><span class="t-small">Night</span><span class="t-caption" style="margin-top:-6px">decision</span></div>
</body></html>
