<!-- @dsCard group="Colors" viewport="700x160" name="Verified contrast pairings" subtitle="Body text is Ink. Text on coral fills is white (brand rule)." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{color:var(--ink);display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px;box-sizing:border-box;height:160px}.p{border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between};.t-caption{color:var(--tint-ink-64)}</style></head><body>
<div class="p" style="background:var(--paper);border:1px solid var(--border-hairline)"><span class="t-body">Ink on Paper</span><span class="t-caption t-data">15.95:1 AAA</span></div>
<div class="p" style="background:var(--coral);color:var(--text-on-coral)"><span class="t-body">White on Coral</span><span class="t-caption t-data" style="color:rgb(255 255 255/.8)">buttons · brand rule</span></div>
<div class="p" style="background:var(--astronaut);color:var(--paper)"><span class="t-body">Paper on Astronaut</span><span class="t-caption t-data" style="color:var(--tint-paper-64)">10.20:1 AAA</span></div>
<div class="p" style="background:var(--reef);color:var(--paper)"><span class="t-body">Paper on Reef</span><span class="t-caption t-data" style="color:var(--tint-paper-64)">10.43:1 AAA</span></div>
<div class="p" style="background:var(--aqua)"><span class="t-body">Ink on Aqua</span><span class="t-caption t-data" style="color:var(--tint-ink-64)">~11:1 AAA</span></div>
<div class="p" style="background:var(--blush)"><span class="t-body">Ink on Blush</span><span class="t-caption t-data" style="color:var(--tint-ink-64)">~11:1 AAA</span></div>
<div class="p" style="background:var(--surface);border:1px solid var(--border-hairline)"><span class="t-body">Ink on Surface</span><span class="t-caption t-data">17.69:1 AAA</span></div>
<div class="p" style="background:var(--paper);border:1px solid var(--border-hairline);color:var(--coral)"><span class="t-body">Coral text</span><span class="t-caption t-data" style="color:var(--coral)">2.49:1 ✗ fill only</span></div>
</body></html>
