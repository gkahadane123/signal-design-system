<!-- @dsCard group="Colors" viewport="700x140" name="Opacity tints" subtitle="All UI tints derive from the eight via opacity — no other named colors exist." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{color:var(--ink);display:flex;gap:16px;padding:16px;box-sizing:border-box;height:140px}.cell{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:center}.dot{width:100%;height:44px;border-radius:6px};.t-caption{color:var(--tint-ink-64)}</style></head><body>
<div style="flex:3;display:flex;gap:8px;background:var(--surface);border:1px solid var(--border-hairline);border-radius:var(--radius-card-sm);padding:12px">
<div class="cell"><div class="dot" style="background:var(--tint-ink-4)"></div><span class="t-caption t-data">ink 4</span></div>
<div class="cell"><div class="dot" style="background:var(--tint-ink-8)"></div><span class="t-caption t-data">8</span></div>
<div class="cell"><div class="dot" style="background:var(--tint-ink-12)"></div><span class="t-caption t-data">12 border</span></div>
<div class="cell"><div class="dot" style="background:var(--tint-ink-24)"></div><span class="t-caption t-data">24</span></div>
<div class="cell"><div class="dot" style="background:var(--tint-ink-48)"></div><span class="t-caption t-data">48 subtle</span></div>
<div class="cell"><div class="dot" style="background:var(--tint-ink-64)"></div><span class="t-caption t-data">64 muted</span></div>
</div>
<div style="flex:1.3;display:flex;gap:8px;background:var(--ink);border-radius:var(--radius-card-sm);padding:12px">
<div class="cell"><div class="dot" style="background:var(--tint-paper-8)"></div><span class="t-caption t-data" style="color:var(--tint-paper-64)">paper 8</span></div>
<div class="cell"><div class="dot" style="background:var(--tint-paper-16)"></div><span class="t-caption t-data" style="color:var(--tint-paper-64)">16</span></div>
</div></body></html>
