<!-- @dsCard group="Structure" viewport="700x150" name="Radii & hairlines" subtitle="6px chips · 8px buttons/inputs · 12–16px cards. Hairline borders everywhere." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{color:var(--ink);display:flex;align-items:center;gap:14px;padding:16px 24px;box-sizing:border-box;height:150px}.r{background:var(--surface);border:1px solid var(--border-hairline);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px};.t-caption{color:var(--tint-ink-64)}</style></head><body>
<div class="r" style="width:120px;height:64px;border-radius:var(--radius-chip)"><span class="t-small t-data">6px</span><span class="t-caption">chips · tags</span></div>
<div class="r" style="width:150px;height:76px;border-radius:var(--radius-btn)"><span class="t-small t-data">8px</span><span class="t-caption">buttons · inputs</span></div>
<div class="r" style="width:170px;height:92px;border-radius:var(--radius-card-sm)"><span class="t-small t-data">12px</span><span class="t-caption">small cards</span></div>
<div class="r" style="width:190px;height:108px;border-radius:var(--radius-card);box-shadow:var(--shadow-card)"><span class="t-small t-data">16px</span><span class="t-caption">cards · shadow-card</span></div>
</body></html>
