<!-- @dsCard group="Structure" viewport="700x170" name="Line-grid substrate" subtitle="32px hairline coordinate grid with technical framing. Lines are neutral — never coral." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{color:var(--ink);padding:16px;box-sizing:border-box;height:170px}.wrap{position:relative;height:100%;border:1px solid var(--border-strong);border-radius:0;background:var(--line-grid);background-color:var(--paper)}.tick{position:absolute;color:var(--tint-ink-48)}.cross{position:absolute;width:13px;height:13px}.cross::before,.cross::after{content:"";position:absolute;background:var(--tint-ink-48)}.cross::before{left:6px;top:0;width:1px;height:13px}.cross::after{top:6px;left:0;height:1px;width:13px};.t-caption{color:var(--tint-ink-64)}</style></head><body>
<div class="wrap">
<span class="tick t-caption t-data" style="top:6px;left:8px">x:032 y:064</span>
<span class="tick t-caption t-data" style="bottom:6px;right:8px">grid · 32px</span>
<div class="cross" style="top:42px;left:250px"></div>
<div class="cross" style="bottom:34px;right:160px"></div>
<span style="position:absolute;top:58px;left:96px;width:8px;height:8px;border-radius:50%;background:var(--coral)"></span>
<span style="position:absolute;bottom:50px;right:230px;width:6px;height:6px;border-radius:50%;background:var(--aqua)"></span>
</div></body></html>
