<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{color:var(--ink);padding:16px;box-sizing:border-box;height:190px;display:flex;gap:14px}.c{flex:1;background:var(--surface);border:1px solid var(--border-hairline);border-radius:var(--radius-card-sm);padding:16px;display:flex;flex-direction:column;gap:10px}.c .t-caption{color:var(--tint-ink-64)}img{width:56px;height:56px;display:block}.r{display:flex;align-items:flex-end;gap:12px}</style></head><body>
<div class="c"><span class="t-label">Sizes · floor 48px</span><div class="r"><img src="../assets/icons/dollar-target.svg" alt="" style="width:48px;height:48px"><img src="../assets/icons/dollar-target.svg" alt="" style="width:64px;height:64px"></div><span class="t-caption t-data">48 · 64 · 96 — never below 48</span></div>
<div class="c"><span class="t-label">Two colors</span><div class="r"><img src="../assets/icons/database-sync.svg" alt=""><span class="t-small">ink = structure<br>coral = the subject</span></div><span class="t-caption">Never a third color</span></div>
<div class="c"><span class="t-label">Geometry</span><div class="r"><img src="../assets/icons/refresh-cycle.svg" alt=""><span class="t-small t-data">96 grid · 3px stroke<br>round cap/join · 2px margin</span></div><span class="t-caption">Accent dot r = 7.5px (5× stroke)</span></div>
<div class="c"><span class="t-label">Dark mode</span><div class="r" style="background:var(--ink);border-radius:8px;padding:8px"><img src="../assets/icons/lightning-bolt.svg" alt="" style="color:#E8E9ED"></div><span class="t-caption">Ink flips to #E8E9ED, accent does not</span></div>
